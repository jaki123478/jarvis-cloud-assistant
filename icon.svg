<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#003852" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#050d1a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#02050a" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#99f6ff"/>
      <stop offset="70%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#006699" stop-opacity="0.2"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="512" height="512" rx="100" fill="url(#bgGlow)" />
  <circle cx="256" cy="256" r="240" fill="none" stroke="#00f0ff" stroke-width="4" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="230" fill="none" stroke="#00d2ff" stroke-width="2" stroke-dasharray="14 10" stroke-opacity="0.7" />

  <!-- Outer ring degree markings -->
  <g stroke="#00f0ff" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="256" y1="36" x2="256" y2="56" />
    <line x1="256" y1="456" x2="256" y2="476" />
    <line x1="36" y1="256" x2="56" y2="256" />
    <line x1="456" y1="256" x2="476" y2="256" />
    <line x1="100" y1="100" x2="115" y2="115" />
    <line x1="412" y1="100" x2="397" y2="115" />
    <line x1="100" y1="412" x2="115" y2="397" />
    <line x1="412" y1="412" x2="397" y2="397" />
  </g>

  <!-- Coil blocks ring -->
  <g filter="url(#neonGlow)">
    <circle cx="256" cy="256" r="180" fill="none" stroke="#0077b6" stroke-width="36" stroke-opacity="0.3" />
    <!-- 10 arc reactor coil blocks -->
    <circle cx="256" cy="256" r="180" fill="none" stroke="#00f0ff" stroke-width="32"
            stroke-dasharray="80 33" stroke-linecap="round" />
  </g>

  <!-- Middle concentric structural ring -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="#00a8e8" stroke-width="6" stroke-opacity="0.8" />
  <circle cx="256" cy="256" r="115" fill="none" stroke="#e0f7fa" stroke-width="3" stroke-dasharray="20 12" />

  <!-- Inner glowing core -->
  <circle cx="256" cy="256" r="85" fill="url(#coreGlow)" filter="url(#neonGlow)" />
  <circle cx="256" cy="256" r="85" fill="none" stroke="#ffffff" stroke-width="5" />

  <!-- Center geometric triangle -->
  <polygon points="256,195 308,285 204,285" fill="#003852" stroke="#00f0ff" stroke-width="4" />
  <polygon points="256,215 292,278 220,278" fill="#e0f7fa" opacity="0.9" />

  <!-- Center pulse dot -->
  <circle cx="256" cy="256" r="12" fill="#ffffff" filter="url(#neonGlow)" />
</svg>
