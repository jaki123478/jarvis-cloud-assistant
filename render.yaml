services:
  - type: web
    name: jarvis-cloud
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /status
    envVars:
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
    value: openai/gpt-oss-120b
        - key: LLM_BASE_URL
          value: https://api.groq.com/openai/v1
